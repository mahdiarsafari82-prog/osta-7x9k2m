<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>دریافت لوگوی دخانیات اوستا (PNG)</title>
<style>
  body {
    background: #0a0a0e;
    color: #f2ead8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: sans-serif;
    margin: 0;
  }
  .preview {
    width: 250px;
    height: 250px;
    margin-bottom: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    border-radius: 50%;
  }
  button {
    background: linear-gradient(135deg, #f6d365, #d4af37);
    color: #1a1408;
    border: none;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(212,175,55,0.4);
  }
</style>
</head>
<body>

<canvas id="canvas" width="512" height="512" class="preview"></canvas>
<button onclick="downloadPNG()">⬇️ دانلود لوگو با فرمت PNG (۵۱۲×۵۱۲)</button>

<script>
const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1a24" />
      <stop offset="100%" stop-color="#0a0a0e" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>
    <linearGradient id="smokeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#f6d365" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="12 6" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />
  <path d="M220 220 C210 170, 290 150, 270 90 C260 60, 280 40, 290 30" fill="none" stroke="url(#smokeGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M250 200 C240 160, 310 130, 295 80" fill="none" stroke="url(#smokeGrad)" stroke-width="4" stroke-linecap="round" />
  <g fill="url(#goldGrad)">
    <path d="M236 150 L256 125 L276 150 L290 135 L282 165 L230 165 L222 135 Z" />
    <path d="M246 185 H266 V305 H246 Z" />
    <circle cx="256" cy="200" r="8" fill="#f6d365" />
    <path d="M170 300 C210 335, 302 335, 342 300 C322 345, 190 345, 170 300 Z" />
  </g>
  <text x="256" y="380" text-anchor="middle" fill="url(#goldGrad)" font-family="Tahoma, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="3">دخانیات اوستا</text>
  <text x="256" y="415" text-anchor="middle" fill="#9a927e" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="6">OSTA TOBACCO</text>
</svg>`;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const img = new Image();

img.onload = function() {
  ctx.drawImage(img, 0, 0);
};
img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));

function downloadPNG() {
  const link = document.createElement('a');
  link.download = 'osta_logo.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
